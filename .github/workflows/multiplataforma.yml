# Apps nativas: Android (APK firmado), iPhone/iPad (comprobación del proyecto Xcode), Windows (.exe) y Mac (.dmg),
# y una versión en Releases con los enlaces de descarga directa.
#
# - Ramas auditoria/** y apps/**: versión de PRUEBA (vX.Y.Z-beta.N, marcada como prerelease).
# - Rama version/** (p. ej. version/2.1.0) o etiqueta v*: versión DEFINITIVA vX.Y.Z (la última en Releases).
#   Con la rama no hace falta poder subir etiquetas: la crea GitHub al publicar la versión.
# - También a mano (Actions › Run workflow). No toca GitHub Pages (publicar.yml).
#
# Secretos que usa (los mismos que publicar.yml):
#   SEMENCES_FIRMA  keystore del APK en base64: con la misma firma y el mismo id, la app nueva actualiza la anterior
#   SEMENCES_CLAVE  su contraseña
#   SEMENCES_API    dirección del backend; sin ella, las apps funcionan sin conexión
name: Apps nativas (Android, iOS, Windows y Mac)

on:
  push:
    branches: ['auditoria/**', 'apps/**', 'version/**']
    tags: ['v*']
    # Un cambio solo en la documentación no vuelve a compilar las apps
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multiplataforma-${{ github.ref }}
  cancel-in-progress: true

env:
  # 2.1.0: Fase 2 + Lote A + Lote B + salida a producción (drive.file, Editar, latido, arranque directo en el CRM)
  VERSION_APP: '2.1.0'

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:10.11
        env: { MARIADB_ROOT_PASSWORD: prueba, MARIADB_DATABASE: semences_prueba, MARIADB_USER: semences, MARIADB_PASSWORD: prueba }
        ports: ['33062:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: servidor/package-lock.json
      - name: Backend
        working-directory: servidor
        env:
          PRUEBA_BASES: 127.0.0.1:33062
        run: |
          npm ci
          npm test
      - name: App web
        run: node --test pruebas-web/*.test.js

  android:
    needs: pruebas
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Dependencias y web para la app
        env:
          SEMENCES_API: ${{ secrets.SEMENCES_API }}
        run: |
          npm ci
          node herramientas/preparar-web.mjs --plataforma=capacitor
          npx cap sync android
      - name: Firma de producción (la misma de la app Android anterior)
        env:
          FIRMA: ${{ secrets.SEMENCES_FIRMA }}
        run: |
          if [ -z "$FIRMA" ]; then echo "::error::Falta el secreto SEMENCES_FIRMA"; exit 1; fi
          echo "$FIRMA" | base64 -d > "$RUNNER_TEMP/semences.keystore"
      - name: Compilar el APK de producción
        working-directory: movil/android
        env:
          SEMENCES_ALMACEN: ${{ runner.temp }}/semences.keystore
          SEMENCES_CLAVE: ${{ secrets.SEMENCES_CLAVE }}
          VERSION_NAME: ${{ env.VERSION_APP }}
        run: |
          # versionCode: 210 (2.1.0) más el número de la ejecución, para que cada APK actualice al anterior
          export VERSION_CODE=$((210 + GITHUB_RUN_NUMBER))
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      # La app nueva solo se instala encima de la que ya tiene el equipo si va firmada con el mismo certificado:
      # se compara con el APK publicado en GitHub Pages y, si no coincide, no se publica nada
      - name: Comprobar la firma (igual que la app publicada) y nombrar el APK
        run: |
          APK=movil/android/app/build/outputs/apk/release/app-release.apk
          HERRAMIENTAS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          certificado() { "$HERRAMIENTAS/apksigner" verify --print-certs "$1" | grep -E "certificate SHA-256 digest" | head -1 | awk '{print $NF}'; }
          "$HERRAMIENTAS/aapt" dump badging "$APK" | head -1
          NUEVO=$(certificado "$APK")
          if [ -z "$NUEVO" ]; then echo "::error::El APK no está firmado"; exit 1; fi
          echo "Certificado del APK nuevo:          $NUEVO"
          if curl -sfL -o anterior.apk "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/Semences.apk"; then
            ANTERIOR=$(certificado anterior.apk)
            echo "Certificado de la app publicada:    $ANTERIOR"
            if [ "$NUEVO" != "$ANTERIOR" ]; then echo "::error::La firma no coincide con la app publicada: no se instalaría encima"; exit 1; fi
            echo "Misma firma que la app publicada: se instala encima, como actualización"
          else
            echo "::warning::No se pudo descargar la app publicada para comparar la firma"
          fi
          mkdir -p salida && cp "$APK" "salida/Semences-${VERSION_APP}-Android.apk"
          rm -f "$RUNNER_TEMP/semences.keystore"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: salida/*.apk

  ios:
    needs: pruebas
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Xcode más reciente del equipo
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Dependencias y web para la app
        env:
          SEMENCES_API: ${{ secrets.SEMENCES_API }}
        run: |
          npm ci
          node herramientas/preparar-web.mjs --plataforma=capacitor
          npx cap sync ios
      # Sin certificado de Apple no se puede firmar para iPhone: se compila para el Simulador, lo que comprueba
      # que el proyecto, los plugins (Swift Package Manager) y la configuración están bien
      - name: Compilar para el Simulador de iOS (iPhone y iPad)
        working-directory: movil/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -30
          APP=$(find build/Build/Products -name 'App.app' -type d | head -1)
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          mkdir -p "$GITHUB_WORKSPACE/salida"
          ditto -c -k --keepParent "$APP" "$GITHUB_WORKSPACE/salida/Semences-${VERSION_APP}-iOS-Simulador.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: salida/*.zip

  windows:
    needs: pruebas
    runs-on: windows-latest
    defaults:
      run:
        working-directory: escritorio
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: escritorio/package-lock.json
      - run: npm ci
      - name: Instalador de Windows (x64)
        env:
          SEMENCES_API: ${{ secrets.SEMENCES_API }}
        run: npm run dist:win
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: escritorio/dist/*.exe

  mac:
    needs: pruebas
    runs-on: macos-15
    defaults:
      run:
        working-directory: escritorio
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: escritorio/package-lock.json
      - run: npm ci
      - name: App de Mac (Intel y Apple Silicon)
        env:
          SEMENCES_API: ${{ secrets.SEMENCES_API }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac
      - name: Comprobar la firma ad-hoc (sin ella, la app no abre en Apple Silicon)
        run: |
          codesign --verify --deep --strict --verbose=2 "dist/mac-arm64/Semences del Caribe.app"
          codesign -dv "dist/mac-arm64/Semences del Caribe.app" 2>&1 | grep -i "Signature=adhoc"
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: |
            escritorio/dist/*.dmg
            escritorio/dist/*.zip

  # Publica en Releases lo que haya compilado. A veces GitHub no tiene equipos Mac libres ("capacity constraints":
  # iOS y Mac se quedan esperando y se cancelan): Android y Windows salen igual y la nota dice qué falta. Al volver a
  # ejecutar solo lo fallido (Re-run failed jobs), lo que faltaba se añade a la misma versión.
  # No corre si se cancela la ejecución a mano ni si no compiló nada
  version:
    needs: [android, ios, windows, mac]
    if: >-
      !cancelled() && (needs.android.result == 'success' || needs.windows.result == 'success' ||
      needs.mac.result == 'success' || needs.ios.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: archivos
          merge-multiple: true
      - name: Versión de prueba en Releases, con los enlaces de descarga
        env:
          GH_TOKEN: ${{ github.token }}
          # Definitiva desde version/** o una etiqueta v*; de prueba desde las demás ramas
          DEFINITIVA: ${{ startsWith(github.ref, 'refs/heads/version/') || startsWith(github.ref, 'refs/tags/v') }}
          ETIQUETA: ${{ (startsWith(github.ref, 'refs/heads/version/') || startsWith(github.ref, 'refs/tags/v')) && format('v{0}', env.VERSION_APP) || format('v{0}-beta.{1}', env.VERSION_APP, github.run_number) }}
          ANDROID: ${{ needs.android.result }}
          WINDOWS: ${{ needs.windows.result }}
          MAC: ${{ needs.mac.result }}
          IOS: ${{ needs.ios.result }}
        run: |
          ls -la archivos
          # Una fila por plataforma que compiló; las demás, en la lista de lo que falta
          faltan=""
          {
            if [ "$DEFINITIVA" = true ]; then
              echo "Versión ${VERSION_APP} de las apps de Semences del Caribe (${GITHUB_SHA::7}): Fase 2 (pedidos, recompra y metas en US\$), Lote A (del pedido al campo), Lote B (Torre de control del Master y Mi agenda con Borja) y la salida a producción (Drive con drive.file, Editar en todos los módulos, despertador del servidor, arranque directo en el CRM)."
            else
              echo "Versión de prueba de las apps de Semences del Caribe (${GITHUB_REF_NAME}, ${GITHUB_SHA::7})."
            fi
            echo
            echo "| Plataforma | Archivo | Cómo instalar |"
            echo "|---|---|---|"
            if [ "$ANDROID" = success ]; then
              echo "| Android | \`Semences-${VERSION_APP}-Android.apk\` | Abrir el archivo en el teléfono y permitir \"instalar apps desconocidas\". Firmada con la misma clave que la app anterior: se instala encima, como actualización |"
            fi
            if [ "$WINDOWS" = success ]; then
              echo "| Windows | \`Semences-${VERSION_APP}-Windows-x64.exe\` | Ejecutar el instalador. Sin certificado de firma de código, Windows SmartScreen avisa: \"Más información\" › \"Ejecutar de todas formas\" |"
            fi
            if [ "$MAC" = success ]; then
              echo "| Mac (Apple Silicon) | \`Semences-${VERSION_APP}-Mac-arm64.dmg\` | Arrastrar a Aplicaciones. La primera vez: clic derecho › Abrir (firma ad-hoc, sin certificado de Apple) |"
              echo "| Mac (Intel) | \`Semences-${VERSION_APP}-Mac-x64.dmg\` | Igual que la de Apple Silicon |"
            fi
            if [ "$IOS" = success ]; then
              echo "| iPhone / iPad | \`Semences-${VERSION_APP}-iOS-Simulador.zip\` | Solo para el Simulador de Xcode. Para instalar en un iPhone o publicar en la App Store hace falta una cuenta de Apple Developer (ver DOCUMENTACION_SISTEMA_COMPLETO.md) |"
            fi
            echo
            echo "Antes de actualizar la app Android, ábrela con conexión y espera a que diga \"sincronizado\": la app nueva"
            echo "guarda sus datos en otro sitio y hay que volver a entrar con Google."
          } > notas.md
          if [ "$ANDROID" != success ]; then faltan="${faltan}Android, "; fi
          if [ "$WINDOWS" != success ]; then faltan="${faltan}Windows, "; fi
          if [ "$MAC" != success ]; then faltan="${faltan}Mac, "; fi
          if [ "$IOS" != success ]; then faltan="${faltan}iPhone / iPad, "; fi
          if [ -n "$faltan" ]; then
            {
              echo
              echo "**Faltan en esta versión: ${faltan%, }.** No compilaron (a veces GitHub no tiene equipos Mac libres)."
              echo "En Actions › esta ejecución › Re-run jobs › Re-run failed jobs se vuelven a compilar y se añaden aquí mismo."
            } >> notas.md
            echo "::warning::Versión publicada sin: ${faltan%, }"
          fi
          if gh release view "$ETIQUETA" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Segunda vuelta (Re-run failed jobs): lo que faltaba se añade a la misma versión
            gh release upload "$ETIQUETA" archivos/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$ETIQUETA" --repo "$GITHUB_REPOSITORY" --notes-file notas.md
          else
            if [ "$DEFINITIVA" = true ]; then
              gh release create "$ETIQUETA" archivos/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                --latest --title "Semences del Caribe ${VERSION_APP}" --notes-file notas.md
            else
              gh release create "$ETIQUETA" archivos/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                --prerelease --title "Apps ${VERSION_APP} (prueba ${{ github.run_number }})" --notes-file notas.md
            fi
          fi
          echo "Descargas: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${ETIQUETA}"
