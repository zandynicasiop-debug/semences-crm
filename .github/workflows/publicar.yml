# Cada vez que se suben cambios a main: compila y firma el APK y publica la app (con el APK para descargar)
# en GitHub Pages. También se puede lanzar a mano desde la pestaña Actions › "Compilar APK y publicar la app".
#
# Secretos del repositorio (Settings › Secrets and variables › Actions):
#   SEMENCES_FIRMA  el archivo android/firma/semences.keystore en base64
#   SEMENCES_CLAVE  el contenido de android/firma/clave.txt
#   SEMENCES_API    dirección del backend Node (p. ej. https://api.semillasdata.com): base MySQL y Google
#   SEMENCES_URL    URL del Web App de Apps Script (termina en /exec)        } solo si no hay backend;
#   SEMENCES_TOKEN  la misma clave que la propiedad TOKEN del Apps Script   } sin nada, la app va sin conexión
name: Compilar APK y publicar la app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Pruebas del backend (servidor/) contra MySQL y MariaDB reales: si fallan, no se publica nada.
  # En Node 22 y en Node 24 (la LTS activa): así se sabe antes de cambiar la versión de Node del hosting
  probar-servidor:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: ['22', '24']
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: prueba, MYSQL_DATABASE: semences_prueba, MYSQL_USER: semences, MYSQL_PASSWORD: prueba }
        ports: ['33061:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pprueba" --health-interval=5s --health-timeout=5s --health-retries=30
      mariadb:
        image: mariadb:10.11
        env: { MARIADB_ROOT_PASSWORD: prueba, MARIADB_DATABASE: semences_prueba, MARIADB_USER: semences, MARIADB_PASSWORD: prueba }
        ports: ['33062:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=30
    defaults:
      run:
        working-directory: servidor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: servidor/package-lock.json
      - run: npm ci
      - run: npm test
      # Pruebas de la app web (cotizador, WhatsApp, sincronización sin conexión): sin dependencias
      - name: Pruebas de la app web
        run: node --test ../pruebas-web/*.test.js

  # Tipos (npx tsc --noEmit, tsconfig.json): los archivos con // @ts-check, en modo estricto (motor de eventos,
  # flujos, lote sin conexión del servidor y la cola sin conexión de la web). Si fallan, no se publica nada
  comprobar-tipos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            servidor/package-lock.json
      # TypeScript y los tipos de Node están en la raíz; los del servidor (mysql2, Google…), en servidor/
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: servidor
      - run: npx tsc --noEmit

  compilar:
    needs: [probar-servidor, comprobar-tipos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Herramientas de Android (plataforma 34 y build-tools 34.0.0)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Firma del APK desde los secretos
        env:
          FIRMA: ${{ secrets.SEMENCES_FIRMA }}
          CLAVE: ${{ secrets.SEMENCES_CLAVE }}
        run: |
          if [ -z "$FIRMA" ] || [ -z "$CLAVE" ]; then
            echo "::error::Faltan los secretos SEMENCES_FIRMA y SEMENCES_CLAVE (ver android/LEEME.md)"
            exit 1
          fi
          mkdir -p android/firma
          echo "$FIRMA" | base64 -d > android/firma/semences.keystore
          printf '%s' "$CLAVE" > android/firma/clave.txt

      - name: Conexión con el backend o con Google (desde los secretos)
        env:
          API_BACKEND: ${{ secrets.SEMENCES_API }}
          URL_APPS_SCRIPT: ${{ secrets.SEMENCES_URL }}
          TOKEN_APP: ${{ secrets.SEMENCES_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os
          ruta = 'googleSync.js'
          js = open(ruta, encoding='utf-8').read()
          # Con el backend (SEMENCES_API) basta su dirección; si no, el Apps Script necesita URL y clave
          if os.environ.get('API_BACKEND', '').strip():
              campos = {'api': os.environ['API_BACKEND'].strip().rstrip('/')}
          elif os.environ.get('URL_APPS_SCRIPT', '').strip() and os.environ.get('TOKEN_APP', '').strip():
              campos = {'url': os.environ['URL_APPS_SCRIPT'].strip(), 'token': os.environ['TOKEN_APP'].strip()}
          else:
              print('::warning::Sin SEMENCES_API ni SEMENCES_URL/SEMENCES_TOKEN: la app se publica sin conexión')
              campos = {}
          for campo, valor in campos.items():
              hueco = f"    {campo}: '',"
              assert hueco in js, f'No encuentro {hueco!r} en googleSync.js'
              js = js.replace(hueco, f"    {campo}: {json.dumps(valor)},", 1)
          open(ruta, 'w', encoding='utf-8').write(js)
          PY

      - name: Compilar y firmar el APK
        run: ANDROID_SDK="$ANDROID_HOME" ./android/build.sh

      - name: APK como archivo descargable de esta ejecución
        uses: actions/upload-artifact@v7
        with:
          name: Semences-apk
          path: android/salida/Semences.apk

      # Lo que se sube a FastComet a mano, siempre al día con main (Actions › esta ejecución › Artifacts):
      #   semences-web-dominio.zip  la web para public_html de semillasdata.com (con .htaccess y el APK)
      #   semences-servidor.tar.gz  el backend para la app Node de api.semillasdata.com (sin node_modules ni .env).
      #                             En .tar.gz: el antivirus de FastComet bloquea los .zip con archivos .js
      #                             (Sanesecurity.Foxhole.JS_Zip, un falso positivo). Va también en .zip
      # Otra dirección para la web: variable del repositorio SEMENCES_WEB (Settings › Variables)
      - name: Paquetes para subir a FastComet
        env:
          URL_DOMINIO: ${{ vars.SEMENCES_WEB || 'https://semillasdata.com' }}
        run: |
          ./publicar.sh "$URL_DOMINIO"
          if grep -q "^    api: ''," publicar/googleSync.js; then
            echo "::warning::El paquete web para FastComet va SIN CONEXIÓN: crea el secreto SEMENCES_API (https://api.semillasdata.com) y vuelve a ejecutar este flujo antes de subirlo"
          fi
          cp android/salida/Semences.apk publicar/Semences.apk
          (cd publicar && zip -qr ../semences-web-dominio.zip .)
          (cd servidor && zip -qr ../semences-servidor.zip . -x 'node_modules/*' -x '.env' -x 'pruebas/*')
          tar -czf semences-servidor.tar.gz -C servidor --exclude=node_modules --exclude=.env --exclude=pruebas .
          unzip -l semences-web-dominio.zip | grep -q '\.htaccess'
          unzip -l semences-servidor.zip | grep -q 'package-lock.json'
          tar -tzf semences-servidor.tar.gz | grep -q 'package-lock.json'

      - uses: actions/upload-artifact@v7
        with:
          name: Semences-para-FastComet
          path: |
            semences-web-dominio.zip
            semences-servidor.tar.gz
            semences-servidor.zip

      - id: pages
        uses: actions/configure-pages@v6

      # La dirección va por una variable de entorno y no escrita dentro del script: es la práctica que
      # recomienda GitHub para que un valor de ${{ }} nunca se interprete como código de la terminal
      - name: Carpeta de la web, con el APK para descargar
        env:
          URL_PAGINAS: ${{ steps.pages.outputs.base_url }}
        run: |
          ./publicar.sh "$URL_PAGINAS"
          cp android/salida/Semences.apk publicar/Semences.apk

      - uses: actions/upload-pages-artifact@v5
        with:
          path: publicar

  desplegar:
    needs: compilar
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5
